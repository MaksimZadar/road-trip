services:
  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
      OPENROUTE_API_KEY: ${OPENROUTE_API_KEY}
      ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/migrate.js && node build/index.js"

volumes:
  pgdata:
